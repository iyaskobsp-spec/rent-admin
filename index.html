<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Реєстр договорів оренди</title>
  <link rel="stylesheet" href="rent-admin.css">
</head>
<body>
  <main class="page">
    <h1>Реєстр договорів оренди</h1>
    <p class="subtitle">Договори, умови оренди та контроль строків в одному реєстрі.</p>

    <div id="importPanel">
      <input id="excelFile" type="file" accept=".xlsx">
      <input id="importToken" type="password" placeholder="Ключ імпорту" autocomplete="off">
      <button id="loadContractsBtn" type="button">
        Завантажити реєстр
      </button>      
      <button id="importExcelBtn" type="button">
        Імпортувати Excel
      </button>
      <span id="importResult" role="status" aria-live="polite"></span>
    </div>
    
    <div class="toolbar">
      <input id="search" type="search" placeholder="Пошук за ID, ТТ, адресою, сторонами">
      <select id="statusFilter" aria-label="Статус договору">
        <option value="">Усі статуси</option>
        <option value="active">Діючі</option>
        <option value="review">Потребують звірки</option>
        <option value="expired">Строк минув</option>
      </select>
      <span class="count" id="count"></span>
    </div>

    <div class="table-wrap">
      <table id="registry" aria-label="Реєстр договорів оренди">
        <thead></thead>
        <tbody></tbody>
      </table>
      <div class="empty" id="empty" hidden>За цим відбором договорів немає.</div>
    </div>
  </main>

  <script>
    const groups = [
      {
        id: "contract",
        title: "Договір",
        summary: "contractSummary",
        fields: [
          ["number", "№ договору"],
          ["type", "Вид"],
          ["statusText", "Статус"]
        ]
      },
      {
        id: "parties",
        title: "Сторони",
        summary: "partiesSummary",
        fields: [
          ["landlord", "Орендодавець"],
          ["tenant", "Орендар"]
        ]
      },
      {
        id: "terms",
        title: "Строки",
        summary: "termsSummary",
        fields: [
          ["signed", "Підписано"],
          ["started", "Початок"],
          ["ends", "Закінчення"],
          ["renewal", "Продовження"]
        ]
      },
      {
        id: "payment",
        title: "Оплата",
        summary: "paymentSummary",
        fields: [
          ["rent", "Оренда за місяць"],
          ["f1", "Ф1"],
          ["f2", "Ф2"],
          ["due", "Строк оплати"]
        ]
      },
      {
        id: "contacts",
        title: "Контакти",
        summary: "contactsSummary",
        fields: [
          ["contact", "Контакт"],
          ["phone", "Телефон"],
          ["shift", "Перенесення платежу"]
        ]
      },
      {
        id: "other",
        title: "Інші умови",
        summary: "otherSummary",
        fields: [
          ["utilities", "Комунальні"],
          ["power", "Потужність"]
        ]
      },
      {
        id: "documents",
        title: "Документи",
        summary: "documentsSummary",
        fields: [
          ["agreements", "Додаткові угоди"],
          ["verification", "Звірка зі сканом"]
        ]
      }
    ];

    // Лише вигадані приклади для перевірки інтерфейсу.
    const demoRows = [
      {
        id: "DEMO-001", tt: "[101]", address: "м. Київ, вул. Прикладна, 10",
        status: "active", statusText: "Діючий", number: "01/26", type: "оренда",
        contractSummary: "01/26 · діючий",
        landlord: "ФОП Приклад А.", tenant: "ТОВ «Мережа»",
        partiesSummary: "ФОП Приклад А. / ТОВ «Мережа»",
        signed: "15.01.2026", started: "01.02.2026", ends: "31.01.2028",
        renewal: "Повідомити за 30 днів", termsSummary: "До 31.01.2028",
        rent: "80 000 грн", f1: "50 000 грн", f2: "30 000 грн",
        due: "До 5-го за поточний", paymentSummary: "80 000 грн · до 5-го",
        contact: "Олена", phone: "—", shift: "Лише після погодження",
        contactsSummary: "Олена · погоджувати перенесення",
        utilities: "Окрема компенсація", power: "15 кВт",
        otherSummary: "Комунальні окремо",
        agreements: "ДУ №1", verification: "Не звірено",
        documentsSummary: "ДУ №1 · не звірено"
      },
      {
        id: "DEMO-002", tt: "[102]", address: "м. Біла Церква, вул. Тестова, 4",
        status: "review", statusText: "Потребує звірки", number: "07/24",
        type: "суборенда", contractSummary: "07/24 · звірити",
        landlord: "ТОВ «Приклад»", tenant: "ТОВ «Мережа»",
        partiesSummary: "ТОВ «Приклад» / ТОВ «Мережа»",
        signed: "20.07.2024", started: "01.08.2024", ends: "31.10.2026",
        renewal: "Уточнити пролонгацію", termsSummary: "До 31.10.2026 · звірити",
        rent: "65 000 грн", f1: "65 000 грн", f2: "—",
        due: "До 20-го за наступний", paymentSummary: "65 000 грн · до 20-го",
        contact: "Бухгалтерія", phone: "—", shift: "Не переносити",
        contactsSummary: "Бухгалтерія · не переносити",
        utilities: "Входять в оренду", power: "—",
        otherSummary: "Комунальні входять",
        agreements: "—", verification: "Не звірено",
        documentsSummary: "Не звірено"
      }
    ];

    let registryRows = [];

    const expanded = new Set();
    const thead = document.querySelector("#registry thead");
    const tbody = document.querySelector("#registry tbody");
    const search = document.querySelector("#search");
    const statusFilter = document.querySelector("#statusFilter");
    const count = document.querySelector("#count");
    const empty = document.querySelector("#empty");

    function cell(tag, value, className = "") {
      const element = document.createElement(tag);
      element.textContent = value ?? "—";
      element.className = className;
      return element;
    }

    function render() {
      const firstHeadRow = document.createElement("tr");
      const secondHeadRow = document.createElement("tr");

      [
        ["ID договору", "fixed-id"],
        ["Код ТТ", "fixed-tt"],
        ["Адреса", "fixed-address"]
      ].forEach(([label, className]) => {
        const th = cell("th", label, className);
        th.rowSpan = 2;
        firstHeadRow.append(th);
      });

      groups.forEach(group => {
        const isExpanded = expanded.has(group.id);
        const th = document.createElement("th");
        th.className = "group-heading";
        th.colSpan = isExpanded ? group.fields.length : 1;

        const button = document.createElement("button");
        button.type = "button";
        button.textContent = `${isExpanded ? "▾" : "▸"} ${group.title}`;
        button.setAttribute("aria-expanded", String(isExpanded));
        button.addEventListener("click", () => {
          if (isExpanded) expanded.delete(group.id);
          else expanded.add(group.id);
          render();
        });

        th.append(button);
        firstHeadRow.append(th);

        const visibleFields = isExpanded
          ? group.fields
          : [[group.summary, "Коротко"]];

        visibleFields.forEach(([, label]) => {
          secondHeadRow.append(cell("th", label, "data-col"));
        });
      });

      thead.replaceChildren(firstHeadRow, secondHeadRow);

      const query = search.value.trim().toLocaleLowerCase("uk");
      const selectedStatus = statusFilter.value;
      const visibleRows = registryRows.filter(row => {
        const matchesStatus = !selectedStatus || row.status === selectedStatus;
        const matchesSearch = !query || Object.values(row)
          .some(value => String(value).toLocaleLowerCase("uk").includes(query));
        return matchesStatus && matchesSearch;
      });

      const fragment = document.createDocumentFragment();

      visibleRows.forEach(row => {
        const tr = document.createElement("tr");
        tr.append(
          cell("td", row.id, "fixed-id"),
          cell("td", row.tt, "fixed-tt"),
          cell("td", row.address, "fixed-address")
        );

        groups.forEach(group => {
          const keys = expanded.has(group.id)
            ? group.fields.map(([key]) => key)
            : [group.summary];

          keys.forEach(key => {
            const td = cell("td", row[key], "data-col");
            if (key === "statusText") {
              td.textContent = "";
              const badge = cell("span", row[key], `status ${row.status}`);
              td.append(badge);
            }
            tr.append(td);
          });
        });

        fragment.append(tr);
      });

      tbody.replaceChildren(fragment);
      count.textContent = `Показано ${visibleRows.length} із ${registryRows.length}`;
      empty.hidden = visibleRows.length !== 0;
    }

    document.querySelector("#importExcelBtn").addEventListener("click", async () => {
      const file = document.querySelector("#excelFile").files[0];
      const tokenInput = document.querySelector("#importToken");
      const token = tokenInput.value.trim();
      const result = document.querySelector("#importResult");
      const button = document.querySelector("#importExcelBtn");

      if (!file || !token) {
        result.textContent = "Виберіть Excel і введіть ключ імпорту.";
        return;
      }

      if (!file.name.toLowerCase().endsWith(".xlsx")) {
        result.textContent = "Потрібен файл формату .xlsx";
        return;
      }

      const formData = new FormData();
      formData.append("file", file);

      button.disabled = true;
      result.textContent = "Завантаження договорів...";

      try {
        const response = await fetch(
          "https://rent-admin-production.up.railway.app/api/contracts/import-excel",
          {
            method: "POST",
            headers: { "x-import-token": token },
            body: formData
          }
        );

        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(data.error || "Помилка імпорту");
        }

        result.textContent =
          `Отримано: ${data.received}. ` +
          `Імпортовано: ${data.imported}. ` +
          `Пропущено: ${data.skipped}.`;

      } catch (error) {
        result.textContent = "Помилка: " + error.message;
      } finally {
        tokenInput.value = "";
        button.disabled = false;
      }
    });

    function formatDate(value) {
      if (!value) return "—";

      const date = String(value).slice(0, 10);
      const parts = date.split("-");

      if (parts.length !== 3) return date;

      return `${parts[2]}.${parts[1]}.${parts[0]}`;
    }

    function getDetail(data, field) {
      const value = data?.[field];
      return value === null || value === undefined || value === ""
        ? "—"
        : String(value);
    }

    function mapContract(c) {
      const payment = c.payment_terms || {};
      const contacts = c.contacts || {};
      const critical = c.critical_terms || {};

      const statusText = c.contract_status || "Не визначено";
      const statusLower = statusText.toLocaleLowerCase("uk");

      let status = "review";

      if (statusLower.includes("діюч") ||
          statusLower.includes("чинн")) {
        status = "active";
      } else if (statusLower.includes("закінч") ||
                 statusLower.includes("припин") ||
                 statusLower.includes("минув")) {
        status = "expired";
      }

      const rent = getDetail(payment, "Орендна плата (джерело)");
      const f1 = getDetail(payment, "Ф1 / б/н");
      const f2tt = getDetail(payment, "Ф2 / нал. ТТ");
      const f2cash = getDetail(payment, "Ф2 / нал. каса");
      const due = getDetail(payment, "Строк/дата оплати");

      const contact = getDetail(
        contacts,
        "Контакт орендодавця (реєстр)"
      );
      const phone = getDetail(contacts, "Телефон");

      return {
        id: c.id,
        tt: c.tt_code || "—",
        address: c.address || "—",

        status,
        statusText,
        number: c.contract_number || "—",
        type: c.contract_type || "—",
        contractSummary: `${c.contract_number || "—"} · ${statusText}`,

        landlord: c.landlord || "—",
        tenant: c.tenant || "—",
        partiesSummary: `${c.landlord || "—"} / ${c.tenant || "—"}`,

        signed: formatDate(c.signed_date),
        started: formatDate(c.start_date),
        ends: formatDate(c.end_date),
        renewal: c.renewal_terms || "—",
        termsSummary: `До ${formatDate(c.end_date)}`,

        rent,
        f1,
        f2: [f2tt, f2cash].filter(v => v !== "—").join(" / ") || "—",
        due,
        paymentSummary: `${rent} · ${due}`,

        contact,
        phone,
        shift: getDetail(critical, "Примітка"),
        contactsSummary: `${contact} · ${phone}`,

        utilities: getDetail(payment, "Комунальні послуги"),
        power: getDetail(payment, "Ввідна потужність, кВт"),
        otherSummary: getDetail(payment, "Комунальні послуги"),

        agreements: getDetail(critical, "Інше"),
        verification: c.verification_status || "—",
        documentsSummary: c.verification_status || "—"
      };
    }

    document.querySelector("#loadContractsBtn").addEventListener("click", async () => {
      const tokenInput = document.querySelector("#importToken");
      const token = tokenInput.value.trim();
      const result = document.querySelector("#importResult");
      const button = document.querySelector("#loadContractsBtn");

      if (!token) {
        result.textContent = "Введіть ключ доступу до реєстру.";
        return;
      }

      button.disabled = true;
      result.textContent = "Завантаження реєстру...";

      try {
        const response = await fetch(
          "https://rent-admin-production.up.railway.app/api/contracts",
          {
            headers: {
              "x-import-token": token
            }
          }
        );

        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(data.error || "Не вдалося отримати договори");
        }

        registryRows = data.contracts.map(mapContract);
        render();

        result.textContent =
          `Реєстр завантажено: ${registryRows.length} договорів.`;

      } catch (error) {
        result.textContent = "Помилка: " + error.message;
      } finally {
        tokenInput.value = "";
        button.disabled = false;
      }
    });
    
    search.addEventListener("input", render);
    statusFilter.addEventListener("change", render);
    render();
  </script>
</body>
</html>
